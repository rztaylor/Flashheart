# Publish a release when the release branch moves (D86). Cutting a release
# is finalising CHANGELOG.md's version section on main, then merging main
# into release (docs/dev/ops/release-governance.md). The version is the
# newest `## [X.Y.Z] - YYYY-MM-DD` section; the run fails before building
# when there is none or its vX.Y.Z tag or release already exists. Then the
# whole of CI (ci.yml: scripts/check.sh on Linux and macOS, the browser
# suite) must pass before the archives are built, and only the last job,
# which runs no repository code, can write: it creates the tag on the
# pushed commit and the GitHub release with the changelog section as notes.
name: Release

on:
  push:
    branches: [release]

permissions:
  contents: read

# One release at a time; a second push waits rather than cancelling it.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Read the version from CHANGELOG.md
        id: version
        run: |
          version=$(go run ./scripts/release version)
          mkdir -p build
          go run ./scripts/release notes > build/release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"
      - name: Refuse a version already tagged or released
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null || status=$?
          case $status in
            0) echo "::error::Tag v$VERSION already exists; add a new version section to CHANGELOG.md."; exit 1 ;;
            2) ;;
            *) echo "::error::Could not list the repository's tags."; exit 1 ;;
          esac
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' | grep -qx "v$VERSION"; then
            echo "::error::Release v$VERSION already exists; add a new version section to CHANGELOG.md."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: build/release-notes.md
          retention-days: 7
          if-no-files-found: error

  ci:
    name: ci
    needs: prepare
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: archives
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The frontend is built once and embedded; the four binaries are
      # cross-compiled from here with CGO_ENABLED=0.
      - name: Build the archives
        env:
          FLASHHEART_VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/package.sh
      - name: Check the checksums
        working-directory: build/dist
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: build/dist
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish
    needs: [prepare, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Check the archives
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS
          test "$(ls flashheart_"$VERSION"_*.tar.gz | wc -l)" -eq 4
      # Checked again here, with write access (which also sees drafts), in
      # case a tag or release appeared while CI ran.
      - name: Refuse a version already tagged or released
        run: |
          if gh api "repos/$GH_REPO/git/matching-refs/tags/v$VERSION" --jq '.[].ref' | grep -qx "refs/tags/v$VERSION"; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi
          if gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep -qx "v$VERSION"; then
            echo "::error::Release v$VERSION already exists."
            exit 1
          fi
      # Creates the tag on the pushed commit and the release in one call.
      - name: Publish v${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Flashheart $VERSION" \
            --notes-file notes/release-notes.md \
            dist/flashheart_"$VERSION"_*.tar.gz dist/SHA256SUMS
