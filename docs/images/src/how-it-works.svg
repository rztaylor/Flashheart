<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="536" viewBox="0 0 1040 536" role="img" aria-labelledby="title">
  <!-- The README's "How it works" diagram (FH-188). The source for
       docs/images/how-it-works-{light,dark}.png: edit this file, then run
       scripts/readme-diagram.sh. Both themes come from the media query. -->
  <title id="title">Claude Code and Codex reach Flashheart through hooks and MCP, which write the board files; your editor edits the same files; flashheart serve watches them and serves the board to your browser.</title>
  <style>
    svg {
      --frame: #d0d7de; --box: #ffffff; --edge: #d0d7de; --well: #f6f8fa;
      --well-edge: #1f2328; --ink: #1f2328; --muted: #59636e;
      --agent: #1d5bd8; --editor: #0f7f4b; --board: #be185d;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --frame: #3d444d; --box: #151b23; --edge: #3d444d; --well: #0d1117;
        --well-edge: #9198a1; --ink: #f0f6fc; --muted: #9198a1;
        --agent: #5b8fff; --editor: #3fb950; --board: #f472b6;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .mono, .mono text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .head { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; fill: var(--muted); }
    .title { font-size: 17px; font-weight: 650; }
    .cmd { font-size: 16px; font-weight: 600; }
    .sub { font-size: 13px; fill: var(--muted); }
    .tree { font-size: 12.5px; }
    .tree .dim { fill: var(--muted); }
    .label { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .frame { fill: none; stroke: var(--frame); stroke-width: 1.5; stroke-dasharray: 6 6; }
    .box { fill: var(--box); stroke: var(--edge); stroke-width: 1.5; }
    .well { fill: var(--well); stroke: var(--well-edge); stroke-width: 2; }
    .line { fill: none; stroke-width: 5; stroke-linecap: round; }
    .stop { fill: var(--box); stroke-width: 3; }
    .agent { stroke: var(--agent); } .agent-ink { fill: var(--agent); }
    .editor { stroke: var(--editor); } .editor-ink { fill: var(--editor); }
    .board { stroke: var(--board); } .board-ink { fill: var(--board); }
  </style>

  <rect class="frame" x="8" y="8" width="1024" height="520" rx="18"/>
  <text class="sub" x="520" y="512" text-anchor="middle">All on your computer: no network calls, no accounts, no telemetry</text>

  <text class="head" x="32" y="46">WHERE YOU WORK</text>
  <text class="head" x="420" y="46">FLASHHEART, ONE BINARY</text>
  <text class="head" x="790" y="46">ON DISK</text>

  <!-- Lines first, so the stations sit on top of them. -->
  <path class="line agent" d="M270 104 H790"/>
  <path class="line agent" d="M270 184 H790"/>
  <path class="line editor" d="M270 286 H790"/>
  <path class="line board" d="M270 428 H790"/>

  <text class="label agent-ink" x="345" y="94">hooks</text>
  <text class="label agent-ink" x="345" y="174">MCP</text>
  <text class="label agent-ink" x="725" y="94">events</text>
  <text class="label agent-ink" x="725" y="174">tickets</text>
  <text class="label editor-ink" x="540" y="276">edit the markdown directly</text>
  <text class="label board-ink" x="345" y="400">loopback,</text>
  <text class="label board-ink" x="345" y="416">authenticated</text>
  <text class="label board-ink" x="725" y="400">watches</text>
  <text class="label board-ink" x="725" y="416">and writes</text>

  <!-- Where you work -->
  <rect class="box" x="32" y="64" width="238" height="160" rx="12"/>
  <text class="title" x="52" y="134">Claude Code, Codex</text>
  <text class="sub" x="52" y="156">your sessions, in their own apps</text>

  <rect class="box" x="32" y="258" width="238" height="56" rx="12"/>
  <text class="title" x="52" y="292">Obsidian or any editor</text>

  <rect class="box" x="32" y="380" width="238" height="96" rx="12"/>
  <text class="title" x="52" y="424">Browser</text>
  <text class="sub" x="52" y="446">the board, in a private tab</text>

  <!-- Flashheart -->
  <rect class="box" x="420" y="72" width="240" height="64" rx="12"/>
  <text class="cmd mono" x="440" y="100">flashheart hook</text>
  <text class="sub" x="440" y="121">records what sessions do</text>

  <rect class="box" x="420" y="152" width="240" height="64" rx="12"/>
  <text class="cmd mono" x="440" y="180">flashheart mcp</text>
  <text class="sub" x="440" y="201">claim, checkpoint, ask, review</text>

  <rect class="box" x="420" y="380" width="240" height="96" rx="12"/>
  <text class="cmd mono" x="440" y="424">flashheart serve</text>
  <text class="sub" x="440" y="446">the board, live as files change</text>

  <!-- On disk -->
  <rect class="well" x="790" y="64" width="218" height="412" rx="12"/>
  <text class="title" x="810" y="100">Board files</text>
  <text class="sub" x="810" y="121">plain markdown you own</text>
  <g class="tree mono">
    <text x="810" y="168">~/reports/Kanban/</text>
    <text x="810" y="192"><tspan class="dim">└ </tspan>flashheart/</text>
    <text x="810" y="216"><tspan class="dim">  ├ </tspan>project.yaml</text>
    <text x="810" y="240"><tspan class="dim">  ├ </tspan>workstreams/</text>
    <text x="810" y="264"><tspan class="dim">  ├ </tspan>tickets/</text>
    <text x="810" y="288"><tspan class="dim">  │ └ </tspan>FH-42-login/</text>
    <text x="810" y="312"><tspan class="dim">  │   ├ </tspan>FH-42-login.md</text>
    <text x="810" y="336"><tspan class="dim">  │   └ </tspan>review.md</text>
    <text x="810" y="360"><tspan class="dim">  └ </tspan>.flashheart/events/</text>
  </g>

  <!-- Stations where each line meets a box. -->
  <g class="stop agent">
    <circle cx="270" cy="104" r="6"/><circle cx="420" cy="104" r="6"/>
    <circle cx="660" cy="104" r="6"/><circle cx="790" cy="104" r="6"/>
    <circle cx="270" cy="184" r="6"/><circle cx="420" cy="184" r="6"/>
    <circle cx="660" cy="184" r="6"/><circle cx="790" cy="184" r="6"/>
  </g>
  <g class="stop editor"><circle cx="270" cy="286" r="6"/><circle cx="790" cy="286" r="6"/></g>
  <g class="stop board">
    <circle cx="270" cy="428" r="6"/><circle cx="420" cy="428" r="6"/>
    <circle cx="660" cy="428" r="6"/><circle cx="790" cy="428" r="6"/>
  </g>
</svg>
